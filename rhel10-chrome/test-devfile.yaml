schemaVersion: 2.3.0
metadata:
  name: devspaces-chrome
components:
- name: dev-tools
  container:
    image: quay.io/cgruver0/che/chrome-devspaces-ubi10:latest
    memoryLimit: 6Gi
    cpuLimit: 1000m
    mountSources: true
    env:
    - name: SHELL
      value: "/bin/zsh"
    endpoints:
      - exposure: public
        name: kasmvnc
        targetPort: 8444
        protocol: https
- name: oauth-proxy
  attributes:
    pod-overrides:
      metadata:
        labels:
          app: proxy
      spec:
        volumes:
        - name: proxy-tls
          secret:
            secretName: proxy-tls
    container-overrides: 
      volumeMounts:
        - mountPath: /etc/tls/private
          name: proxy-tls
  container:
    image: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
    args:
    - --https-address=:8443
    - --provider=openshift
    - --upstream=http://localhost:8444
    - --tls-cert=/etc/tls/private/tls.crt
    - --tls-key=/etc/tls/private/tls.key
    - --cookie-secret=SECRET
    endpoints:
      - exposure: none
        name: proxy
        protocol: https
        targetPort: 8443
