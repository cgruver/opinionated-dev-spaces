error_log /dev/stdout info;
access_log /dev/stdout;

server {
    listen 8080; # Avoid privileged ports (<1024) for OpenShift SCCs
    server_name localhost;

    # 1. Catch the UI and assets path, strip the prefix, and pass to KasmVNC
    location /8080/ {
        proxy_pass https://127.0.0.1:8444; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_ssl_verify off; # If using KasmVNC self-signed certs
    }

    # 2. Catch the hardcoded client-side WebSocket request breakout
    location /websockify {
        proxy_pass https://127.0.0.1:8444/websockify;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 1800s;
        proxy_ssl_verify off;
    }
}