apiVersion: v1                      
kind: Namespace                 
metadata:
  name: imported-images
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: imported-images-image-puller
  namespace: imported-images
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:serviceaccounts
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: postgresql-15-c9s
  namespace: imported-images
spec:
  lookupPolicy:
    local: false
  tags:
  - annotations: null
    from:
      kind: DockerImage
      name: quay.io/sclorg/postgresql-15-c9s:c9s
    generation: 1
    importPolicy:
      importMode: Legacy
    name: c9s
    referencePolicy:
      type: Source
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ubi10
  namespace: imported-images
