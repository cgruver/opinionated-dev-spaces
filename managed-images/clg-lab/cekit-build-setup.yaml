apiVersion: v1                      
kind: Namespace                 
metadata:
  name: cekit-build
---
apiVersion: v1                      
kind: Namespace                 
metadata:
  name: devspaces-images
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:image-puller
  namespace: devspaces-images
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:serviceaccounts
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: pipeline-user-namespaces
priority: null
allowPrivilegeEscalation: true
allowedCapabilities:
- SETUID
- SETGID
fsGroup:
  type: MustRunAs
  ranges:
  - min: 1000
    max: 65534
runAsUser:
  type: MustRunAs
  uid: 1000
seLinuxContext:
  type: MustRunAs
  seLinuxOptions:
    type: container_engine_t
supplementalGroups:
  type: MustRunAs
  ranges:
  - min: 1000
    max: 65534
userNamespaceLevel: RequirePodLevel
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cekit-builder
  namespace: cekit-build
secrets:
- name: nexus-pull-secret
imagePullSecrets:
- name: nexus-pull-secret
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cekit-builder-user-namespaces
rules:
  - verbs:
      - use
    apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - pipeline-user-namespaces
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cekit-builder-user-namespaces
  namespace: cekit-build
subjects:
  - kind: ServiceAccount
    name: cekit-builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cekit-builder-user-namespaces
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: cekit-builder
  namespace: cekit-build
spec:
  source:
    git:
      uri: https://github.com/cgruver/opinionated-dev-spaces.git
      ref: main
    contextDir: "pipelines/cekit-builder-image"
  strategy:
    dockerStrategy:
      dockerfilePath: "./Containerfile"
  output:
    to:
      kind: DockerImage
      name: nexus.clg.lab:5002/dev-spaces/cekit-builder:latest