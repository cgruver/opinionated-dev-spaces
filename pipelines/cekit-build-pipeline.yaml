apiVersion: v1                      
kind: Namespace                 
metadata:
  name: cekit-images
---
apiVersion: v1                      
kind: Namespace                 
metadata:
  name: imported-images
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cekit-images-image-puller
  namespace: cekit-images
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:serviceaccounts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: imported-images-image-puller
  namespace: imported-images
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:serviceaccounts
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: pipeline-user-namespaces
priority: null
allowPrivilegeEscalation: true
allowedCapabilities:
- SETUID
- SETGID
fsGroup:
  type: MustRunAs
  ranges:
  - min: 1000
    max: 65534
runAsUser:
  type: MustRunAs
  uid: 1000
seLinuxContext:
  type: MustRunAs
  seLinuxOptions:
    type: container_engine_t
supplementalGroups:
  type: MustRunAs
  ranges:
  - min: 1000
    max: 65534
userNamespaceLevel: RequirePodLevel
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cekit-builder
  namespace: cekit-images
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cekit-builder-user-namespaces
  namespace: cekit-images
rules:
  - verbs:
      - use
    apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - pipeline-user-namespaces
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cekit-builder-user-namespaces
  namespace: cekit-images
subjects:
  - kind: ServiceAccount
    name: cekit-builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cekit-builder-user-namespaces
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cekit-image-builder
  namespace: cekit-images
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
- kind: ServiceAccount
  name: cekit-builder
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: cekit-builder
  namespace: cekit-images
spec:
  source:
    git:
      uri: https://github.com/cgruver/opinionated-dev-spaces.git
      ref: main
    contextDir: "pipelines/cekit-builder-image"
  strategy:
    dockerStrategy:
      dockerfilePath: "./Containerfile"
  output:
    to:
      kind: DockerImage
      name: image-registry.openshift-image-registry.svc:5000/cekit-images/cekit-builder:latest
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cekit-build-all
  namespace: cekit-images
spec:
  params:
  - name: registry
    type: string
    description: Image registry that built images will be pushed to
  - name: registry-path
    type: string
    description: Path to the image within the registry
  - name: repository
    type: string
    description: The git repository to pull the image and module descriptors from.
  - name: revision
    type: string
    description: The repository branch to clone.
    default: "main"
  tasks:
  - name: base-images
    taskRef:
      name: cekit-builder
    params:
    - name: registry
      value: $(params.registry)
    - name: registry-path
      value: $(params.registry-path)
    - name: image-class
      value: developer
    - name: repository
      value: $(params.repository)
    - name: revision
      value: $(params.revision)
  - name: app-product-images
    runAfter:
    - base-images
    taskRef:
      name: cekit-builder
    params:
    - name: registry
      value: $(params.registry)
    - name: registry-path
      value: $(params.registry-path)
    - name: image-class
      value: app-product
    - name: repository
      value: $(params.repository)
    - name: revision
      value: $(params.revision)
  - name: utility-images
    runAfter:
    - base-images
    taskRef:
      name: cekit-builder
    params:
    - name: registry
      value: $(params.registry)
    - name: registry-path
      value: $(params.registry-path)
    - name: image-class
      value: utility
    - name: repository
      value: $(params.repository)
    - name: revision
      value: $(params.revision)
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cekit-builder
  namespace: cekit-images
  annotations:
    io.kubernetes.cri-o.Devices: '/dev/fuse,/dev/net/tun'
spec:
  params:
  - name: registry
    type: string
    description: Image registry that built images will be pushed to
  - name: registry-path
    type: string
    description: Path to the image within the registry
  - name: image-class
    type: string
    description: The group of images to be built.  base, utility, app-product
  - name: repository
    type: string
    description: The git repository to pull the image and module descriptors from.
  - name: revision
    type: string
    description: The repository branch to clone.
    default: "main"
  stepTemplate:
    securityContext:
      capabilities:
        add:
          - SETGID
          - SETUID
        drop:
          - ALL
      runAsUser: 1000
      runAsNonRoot: true
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: true
      procMount: Unmasked
  steps:
  - name: clone
    image: image-registry.openshift-image-registry.svc:5000/cekit-images/cekit-builder:latest
    script: |
      git clone -b $(params.revision) --single-branch $(params.repository) /workspace/source
  - name: build
    image: image-registry.openshift-image-registry.svc:5000/cekit-images/cekit-builder:latest
    workingDir: "/workspace/source"
    env:
    - name: NODE_EXTRA_CA_CERTS
      value: /tekton-custom-certs/ca-bundle.crt
    script: |
      cd images/$(params.image-class)
      for image in $(ls *.yaml)
      do
        IMAGE_NAME=$(yq e ".name" ${image})
        IMAGE_TAG=$(yq e ".version" ${image})
        IMAGE="$(params.registry)/$(params.registry-path)/${IMAGE_NAME}:${IMAGE_TAG}"
        cekit --descriptor ${image} build podman --build-flag --volume --build-flag ${NODE_EXTRA_CA_CERTS}:${NODE_EXTRA_CA_CERTS}:ro,Z --build-arg NODE_EXTRA_CA_CERTS=${NODE_EXTRA_CA_CERTS} --tag ${IMAGE}
        podman push ${IMAGE}
        podman image rm ${IMAGE}
      done 

