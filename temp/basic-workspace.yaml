components:
  - container:
      cpuLimit: "2"
      cpuRequest: 100m
      env:
        - name: VSCODE_DEFAULT_WORKSPACE
          value: $(PROJECT_SOURCE)/vscode.code-workspace
      image: nexus.clg.lab:5002/dev-spaces/workspace-base:latest
      memoryLimit: 6Gi
      memoryRequest: 1Gi
      mountSources: true
      sourceMapping: /projects
    name: dev-tools
  - name: projects
    volume:
      size: 50Gi
