kind: Pulp
apiVersion: repo-manager.pulpproject.org/v1
metadata:
  name: pulp
  namespace: pulp
spec:
  api:
    replicas: 1
  cache:
    enabled: true
  content:
    replicas: 1
  custom_pulp_settings: settings
  database:
    postgres_image: 'postgres:15'
    postgres_storage_class: qnap-iscsi
  file_storage_access_mode: ReadWriteOnce
  file_storage_size: 20Gi
  file_storage_storage_class: qnap-iscsi
  ingress_type: none
  web:
    replicas: 1
  worker:
    replicas: 1
