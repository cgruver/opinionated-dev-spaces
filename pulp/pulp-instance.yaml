apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulp-storage
  namespace: pulp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulp-psql
  namespace: pulp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulp-redis
  namespace: pulp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
kind: Pulp
apiVersion: repo-manager.pulpproject.org/v1
metadata:
  name: pulp
  namespace: pulp
spec:
  enable_debugging: true
  api:
    replicas: 1
  cache:
    enabled: true
    pvc: pulp-redis
  content:
    replicas: 1
  # custom_pulp_settings: settings
  database:
    postgres_image: 'postgres:15'
    pvc: pulp-psql
  pvc: pulp-storage
  ingress_type: none
  web:
    replicas: 1
  worker:
    replicas: 1
