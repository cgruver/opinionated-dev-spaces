apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: operatorhub-io
  namespace: openshift-marketplace
spec:
  displayName: OperatorHub.io
  image: 'quay.io/operatorhubio/catalog:latest'
  publisher: 'OperatorHub.io'
  sourceType: grpc
---
apiVersion: v1                      
kind: Namespace                 
metadata:
  name: devspaces
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: pulp-operator
  namespace: pulp
spec:
  targetNamespaces:
    - pulp
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: pulp-operator
  namespace: pulp
spec:
  channel: stable
  installPlanApproval: Manual
  name: pulp-operator
  source: operatorhub-io
  sourceNamespace: openshift-marketplace
  startingCSV: pulp-operator.v2.0.0
