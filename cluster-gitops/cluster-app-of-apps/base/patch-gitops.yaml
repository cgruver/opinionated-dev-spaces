
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patch-gitops
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patch-gitops
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups:
      - "argoproj.io"
    resources:
      - "argocds"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "update"
      - "patch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patch-gitops
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: patch-gitops
    namespace: openshift-gitops
roleRef:
  kind: Role
  name: patch-gitops
  apiGroup: rbac.authorization.k8s.io
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: gitops-patch
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  gitops-patch.yaml: |-
    spec:
      resourceHealthChecks:
      - group: operators.coreos.com
        kind: Subscription
        check: |
          health_status = {}
          if obj.status ~= nil then
            if obj.status.state == "AtLatestKnown" or obj.status.state == "UpgradePending" then
              health_status.status = "Healthy"
              health_status.message = obj.status.state
              return health_status
            end
            if obj.status.conditions ~= nil then
              numDegraded = 0
              numPending = 0
              msg = ""
              for i, condition in pairs(obj.status.conditions) do
                msg = msg .. i .. ": " .. condition.type .. " | " .. condition.status .. "\n"
                if condition.type == "InstallPlanPending" and condition.status == "True" then
                  numPending = numPending + 1
                elseif (condition.type == "InstallPlanMissing" and condition.reason ~= "ReferencedInstallPlanNotFound") then
                  numDegraded = numDegraded + 1
                elseif (condition.type == "CatalogSourcesUnhealthy" or condition.type == "InstallPlanFailed") and condition.status == "True" then
                  numDegraded = numDegraded + 1
                end
              end
              if numDegraded == 0 and numPending == 0 then
                health_status.status = "Healthy"
                health_status.message = msg
                return health_status
              elseif numPending > 0 and numDegraded == 0 then
                health_status.status = "Progressing"
                health_status.message = "An install plan for a subscription is pending installation"
                return health_status
              else
                health_status.status = "Degraded"
                health_status.message = msg
                return health_status
              end
            end
          end
          health_status.status = "Progressing"
          health_status.message = "An install plan for a subscription is pending installation"
          return health_status
---
apiVersion: batch/v1
kind: Job
metadata:
  name: patch-gitops
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: patch-gitops
      containers:
      - name: patch-gitops
        image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
        command:
          - /bin/bash
          - -c
          - |
            echo "Patching ArgoCD to ignore pending Install Plans"
            oc patch argocd openshift-gitops --type=merge --patch "$(cat gitops-patch.yaml)"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: gitops-patch
            readOnly: true
            mountPath: /gitops-patch.yaml
            subPath: gitops-patch.yaml
      volumes:
        - name: gitops-patch
          configMap:
            name: gitops-patch
            defaultMode: 416
