---
# ServiceAccount, Role, and RoleBinding that grant permission to approve
# InstallPlans in the release namespace. The pipelines-installplan-approve
# Job uses this account to patch InstallPlans and set spec.approved to true.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipelines-installplan-approver
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipelines-installplan-approver
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups:
      - "operators.coreos.com"
    resources:
      - "installplans"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "update"
      - "patch"
  - apiGroups:
      - "operators.coreos.com"
    resources:
      - "subscriptions"
    verbs:
      - "get"
      - "list"
      - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipelines-installplan-approver
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: pipelines-installplan-approver
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: pipelines-installplan-approver
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pipelines-installplan-approve
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  # ttlSecondsAfterFinished: 1200
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: pipelines-installplan-approver
      containers:
        - name: patch
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for Pipelines InstallPlan to exist..."

              install_plan=""
              until [[ ${install_plan} != "" ]]
              do
                oc get installplan
                STARTING_CSV=$(oc get subscription openshift-pipelines-operator -o jsonpath='{.spec.startingCSV}')
                install_plan=$(oc get installplan | grep ${STARTING_CSV} | cut -d" " -f1)
                if [[ ${install_plan} == "" ]]
                then
                  sleep 15
                fi
              done
              oc patch installplan ${install_plan} --type merge --patch '{"spec":{"approved":true }}'
              echo "Pipelines InstallPlan Approved"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]