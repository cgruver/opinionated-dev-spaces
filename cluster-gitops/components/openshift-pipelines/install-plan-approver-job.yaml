---
# ServiceAccount, Role, and RoleBinding that grant permission to approve
# InstallPlans in the release namespace. The pipelines-installplan-approve
# Job uses this account to patch InstallPlans and set spec.approved to true.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipelines-installplan-approver
  namespace: openshift-pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipelines-installplan-approver
  namespace: openshift-pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups:
      - "operators.coreos.com"
    resources:
      - "installplans"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "update"
      - "patch"
  - apiGroups:
      - "operators.coreos.com"
    resources:
      - "subscriptions"
    verbs:
      - "get"
      - "list"
      - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipelines-installplan-approver
  namespace: openshift-pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: pipelines-installplan-approver
    namespace: openshift-pipelines
roleRef:
  kind: Role
  name: pipelines-installplan-approver
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pipelines-installplan-approve
  namespace: openshift-pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  # ttlSecondsAfterFinished: 1200
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: pipelines-installplan-approver
      containers:
        - name: patch
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |            
              APPROVED="false"
              until [[ ${APPROVED} == "true" ]]
              do
                oc get installplan
                STARTING_CSV=$(oc get subscription openshift-pipelines-operator -o jsonpath='{.spec.startingCSV}')
                for INSTALL_PLAN in $(oc get installplan -o name)
                do
                  for CSV in $(oc get ${INSTALL_PLAN} -o jsonpath='{.spec.clusterServiceVersionNames}' | jq -r ".[]")
                  do
                    if [[ ${CSV} == ${STARTING_CSV} ]]
                    then
                      oc patch installplan ${INSTALL_PLAN} --type merge --patch '{"spec":{"approved":true }}'
                      echo "Operator InstallPlan Approved"
                      APPROVED="true"
                    fi
                  done
                  if [[ ${APPROVED} == "false" ]]
                  then
                    sleep 5
                  fi
                done
              done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]