---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-spaces-installplan-approver
  namespace: openshift-devspaces
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-spaces-installplan-approver
  namespace: openshift-devspaces
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups:
      - "operators.coreos.com"
    resources:
      - "installplans"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "update"
      - "patch"
  - apiGroups:
      - "operators.coreos.com"
    resources:
      - "subscriptions"
    verbs:
      - "get"
      - "list"
      - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-spaces-installplan-approver
  namespace: openshift-devspaces
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: dev-spaces-installplan-approver
    namespace: openshift-devspaces
roleRef:
  kind: Role
  name: dev-spaces-installplan-approver
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dev-spaces-installplan-approve
  namespace: openshift-devspaces
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  # ttlSecondsAfterFinished: 1200
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: dev-spaces-installplan-approver
      containers:
      - name: patch
        image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
        command:
          - /bin/bash
          - -c
          - |
            echo "Waiting for Operator InstallPlan to exist..."
            
            APPROVED="false"
            until [[ ${APPROVED} == "true" ]]
            do
              oc get installplan
              STARTING_CSV=$(oc get subscription devspaces -o jsonpath='{.spec.startingCSV}')
              for INSTALL_PLAN in $(oc get installplan -o name)
              do
                for CSV in $(oc get ${INSTALL_PLAN} -o jsonpath='{.spec.clusterServiceVersionNames[*]}')
                do
                  if [[ ${CSV} == ${STARTING_CSV} ]]
                  then
                    oc patch ${INSTALL_PLAN} --type merge --patch '{"spec":{"approved":true }}'
                    echo "Operator InstallPlan Approved"
                    APPROVED="true"
                  fi
                done
                if [[ ${APPROVED} == "false" ]]
                then
                  sleep 5
                fi
              done
            done
            
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
