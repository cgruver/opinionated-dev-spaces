apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: cekit-builder
  namespace: workspace-images
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  source:
    git:
      uri: https://github.com/cgruver/opinionated-dev-spaces.git
      ref: main
    contextDir: "managed-images/cekit-builder-image"
  strategy:
    dockerStrategy:
      dockerfilePath: "Containerfile"
  output:
    to:
      kind: DockerImage
      name: image-registry.openshift-image-registry.svc:5000/workspace-images/cekit-builder:latest