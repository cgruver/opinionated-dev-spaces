---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipelines-wait-for-operator
  namespace: openshift-pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipelines-wait-for-operator
  namespace: openshift-pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups:
      - "operators.coreos.com"
    resources:
      - "subscriptions"
    verbs:
      - "get"
      - "list"
      - "watch"
  - apiGroups:
      - "apps"
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipelines-wait-for-operator
  namespace: openshift-pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipelines-wait-for-operator
subjects:
  - kind: ServiceAccount
    name: pipelines-wait-for-operator
    namespace: openshift-pipelines
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pipelines-wait-for-operator
  namespace: openshift-pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: pipelines-wait-for-operator
      containers:
        - name: wait
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              until [[ ! -z "${STARTING_CSV}" ]]
              do
                STARTING_CSV=$(oc get subscription openshift-pipelines-operator -o jsonpath='{.spec.startingCSV}')
                if [[ -z "${STARTING_CSV}" ]]
                then
                  echo "Waiting for subscription..."
                  sleep 5
                fi
              done
              echo "Waiting for CSV to succeed..."
              until [[ $(oc get subscription openshift-pipelines-operator -o jsonpath='{.status.installedCSV}') == ${STARTING_CSV} ]]
              do
                echo "  ...CSV not ready yet"
                sleep 5
              done
              echo "CSV ${CSV} succeeded."
              until [[ $(oc get deployment openshift-pipelines-operator -o jsonpath='{.status.readyReplicas}') -eq 1 ]]
              do
                echo "Waiting for openshift-pipelines-operator deployment..."
                sleep 5
              done
              echo "Operator is ready."




