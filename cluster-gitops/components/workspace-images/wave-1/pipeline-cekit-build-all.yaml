apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cekit-build-all
  namespace: workspace-images
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  params:
  - name: registry
    type: string
    description: Image registry that built images will be pushed to
    default: "image-registry.openshift-image-registry.svc:5000"
  - name: registry-path
    type: string
    description: Path to the image within the registry
    default: "workspace-images"
  - name: repository
    type: string
    description: The git repository to pull the image and module descriptors from.
    default: "https://github.com/cgruver/cekit-image-library.git"
  - name: revision
    type: string
    description: The repository branch to clone.
    default: "main"
  tasks:
  - name: base-images
    taskRef:
      name: cekit-class-builder
    params:
    - name: registry
      value: $(params.registry)
    - name: registry-path
      value: $(params.registry-path)
    - name: image-class-name
      value: base-images
    - name: repository
      value: $(params.repository)
    - name: revision
      value: $(params.revision)
    - name: image-class-path
      value: cekit-image-manifests/images/base-images
  - name: workspace-images
    runAfter:
    - base-images
    taskRef:
      name: cekit-class-builder
    params:
    - name: registry
      value: $(params.registry)
    - name: registry-path
      value: $(params.registry-path)
    - name: image-class-name
      value: workspace-images
    - name: repository
      value: $(params.repository)
    - name: revision
      value: $(params.revision)
    - name: image-class-path
      value: cekit-image-manifests/images/workspace-images
