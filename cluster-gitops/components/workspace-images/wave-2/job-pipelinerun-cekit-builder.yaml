apiVersion: batch/v1
kind: Job
metadata:
  name: build-workspace-images
  namespace: workspace-images
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: pipeline
      containers:
        - name: create-pipeline-run
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              count=0
              limit=60
              until [[ ! -z $(oc get is cekit-builder -o jsonpath='{.status.tags[0]}') ]]
              do
                echo "Waiting for cekit-builder image build to complete"
                sleep 5
                
                if [[ ${count} -eq ${limit} ]]
                then
                  echo "Failed waiting for image build to complete"
                  exit 1
                else
                  count=$(( ${count} + 1 ))
                fi
              done
              count=0
              limit=10
              SUCCESS="false"
              until [[ ${SUCCESS} == "true" ]]
              do
              cat << EOF | oc create -f -
              apiVersion: tekton.dev/v1
              kind: PipelineRun
              metadata:
                name: build-all-cekit-${count}
              spec:
                pipelineRef:
                  name: cekit-build-all
                params:
                - name: registry
                  value: "image-registry.openshift-image-registry.svc:5000"
                - name: registry-path
                  value: workspace-images
                - name: repository
                  value: https://github.com/cgruver/opinionated-dev-spaces.git
                - name: revision
                  value: main
                taskRunTemplate:
                  podTemplate:
                    hostUsers: false
                  serviceAccountName: cekit-builder
              EOF
                until [[ ! -z $(oc get pipelinerun build-all-cekit-${count} -o jsonpath='{.status.completionTime}') ]]
                do
                  echo waiting for pipeline run...
                  sleep 10
                done
                if [[ $(oc get pipelinerun build-all-cekit-${count} -o jsonpath='{.status.conditions[0].reason}') == "Succeeded" ]]
                then
                  SUCCESS="true"
                fi
                if [[ ${count} -eq ${limit} ]]
                then
                  echo "Failed waiting for pipeline run to complete"
                  exit 1
                else
                  count=$(( ${count} + 1 ))
                fi
              done
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
