apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulp-cli-image
  namespace: pulp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: pulp-cli-image
  namespace: pulp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
- apiGroups:
    - build.openshift.io
  resources:
    - buildconfigs
  verbs:
    - get
    - list
    - watch
- apiGroups:
    - build.openshift.io
  resources:
    - builds
    - buildconfigs/instantiate
  verbs:
    - create
    - get
    - list
    - watch
- apiGroups:
    - build.openshift.io
  resources:
    - builds
    - builds/log
    - builds/details
  verbs:
    - get
    - list
    - watch
    - update
- apiGroups:
    - image.openshift.io
  resources:
    - imagestreamtags
    - imagestreams
    - imagestreams/layers
  verbs:
    - get
    - watch
    - create
    - update
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: pulp-cli-image
  namespace: pulp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: pulp-cli-image
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pulp-cli-image
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pulp-cli-image
  namespace: pulp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: pulp-cli-image
      containers:
        - name: build-pulp-cli-image
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              count=0
              limit=5
              if oc get imagestreamtag pulp-cli-image:latest
              then
                oc delete imagestreamtag pulp-cli-image:latest
              fi
              while ! oc get imagestreamtag pulp-cli-image:latest
              do
                echo "Waiting for pulp-cli-image image build to complete"
                oc start-build pulp-cli-image -w -F
                count=$(( ${count} + 1 ))
                if [[ ${count} -eq ${limit} ]]
                then
                  echo "Failed to build image"
                  exit 1
                fi
              done
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault