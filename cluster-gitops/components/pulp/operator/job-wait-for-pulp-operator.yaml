---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulp-wait-for-operator
  namespace: pulp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pulp-wait-for-operator
  namespace: pulp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups:
      - "operators.coreos.com"
    resources:
      - clusterserviceversions
    verbs:
      - get
      - list
  - apiGroups:
      - "apps"
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - "operators.coreos.com"
    resources:
      - "installplans"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "update"
      - "patch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pulp-wait-for-operator
  namespace: pulp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pulp-wait-for-operator
subjects:
  - kind: ServiceAccount
    name: pulp-wait-for-operator
    namespace: pulp
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pulp-wait-for-operator
  namespace: pulp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: pulp-wait-for-operator
      containers:
        - name: wait
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              until [[ ! -z "${STARTING_CSV}" ]]
              do
                STARTING_CSV=$(oc get subscription pulp-operator -o jsonpath='{.spec.startingCSV}')
                if [[ -z "${STARTING_CSV}" ]]
                then
                  echo "Waiting for subscription..."
                  sleep 5
                fi
              done
              echo "Waiting for InstallPlan approval..."
              APPROVED="false"
              until [[ ${APPROVED} == "true" ]]
              do
                oc get installplan
                for INSTALL_PLAN in $(oc get installplan -o name)
                do
                  for CSV in $(oc get ${INSTALL_PLAN} -o jsonpath='{.spec.clusterServiceVersionNames[*]}')
                  do
                    if [[ ${CSV} == ${STARTING_CSV} ]]
                    then
                      oc patch ${INSTALL_PLAN} --type merge --patch '{"spec":{"approved":true }}'
                      echo "Operator InstallPlan Approved"
                      APPROVED="true"
                    fi
                  done
                  if [[ ${APPROVED} == "false" ]]
                  then
                    sleep 5
                  fi
                done
              done
              echo "Waiting for Pulp CSV to succeed..."
              until [[ $(oc get subscription pulp-operator -o jsonpath='{.status.installedCSV}') == ${STARTING_CSV} ]]
              do
                echo "  ...CSV not ready yet"
                sleep 5
              done
              echo "CSV ${CSV} succeeded."
              until [[ $(oc get deployment pulp-operator-controller-manager -n pulp -o jsonpath='{.status.readyReplicas}') -eq 1 ]]
              do
                echo "Waiting for pulp-operator-operator deployment..."
                sleep 5
              done
              echo "Operator is ready."
