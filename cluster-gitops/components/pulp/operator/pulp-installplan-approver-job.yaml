apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulp-installplan-approver
  namespace: pulp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pulp-installplan-approver
  namespace: pulp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups:
      - "operators.coreos.com"
    resources:
      - "installplans"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "update"
      - "patch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pulp-installplan-approver
  namespace: pulp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: pulp-installplan-approver
    namespace: pulp
roleRef:
  kind: Role
  name: pulp-installplan-approver
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pulp-installplan-approve
  namespace: pulp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: pulp-installplan-approver
      containers:
      - name: patch
        image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
        command:
          - /bin/bash
          - -c
          - |
            echo "Waiting for Pulp Operator InstallPlan to exist..."            
            install_plan=""
            until [[ ${install_plan} != "" ]]
            do
              oc get installplan
              install_plan=$(oc get installplan | grep "pulp-operator" | grep false | cut -d" " -f1)
              if [[ ${install_plan} == "" ]]
              then
                sleep 15
              fi
            done
            oc patch installplan ${install_plan} --type merge --patch '{"spec":{"approved":true }}'
            echo "Pulp Operator InstallPlan Approved"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
